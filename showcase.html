<style>
/* ========== 1. CSS Variables ========== */
:root {
  --bg-0: #0B0E14;
  --bg-1: #131820;
  --bg-2: #1A2030;
  --bg-3: #252D3F;
  --accent: #7C6BF0;
  --accent-glow: rgba(124,107,240,0.12);
  --accent-2: #00D4AA;
  --text-0: #F0F4F8;
  --text-1: #C4CDD9;
  --text-2: #8295A8;
  --text-3: #5A6E82;
  --border: rgba(124,107,240,0.10);
  --border-strong: rgba(124,107,240,0.25);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
  --ease: cubic-bezier(0.4,0,0.2,1);
  --header-h: 64px;
  --font-cn: "Noto Sans SC","PingFang SC",sans-serif;
  --font-en: "Inter",-apple-system,sans-serif;
}

/* ========== 2. Reset & Base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-cn); background: var(--bg-0); color: var(--text-1); line-height: 1.6; overflow-x: hidden; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; border: none; cursor: pointer; }

/* ========== 3. Background ========== */
.bg-glow {
  position: fixed; top: -300px; left: 30%; width: 700px; height: 700px;
  z-index: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(124,107,240,0.06), transparent 70%);
  border-radius: 50%;
  animation: floatGlow 20s ease-in-out infinite;
}
.bg-glow-2 {
  position: fixed; bottom: -200px; right: -100px; width: 600px; height: 600px;
  z-index: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(0,212,170,0.04), transparent 70%);
  border-radius: 50%;
  animation: floatGlow 24s ease-in-out infinite reverse;
}
@keyframes floatGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(40px, 30px); }
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(rgba(124,107,240,0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(124,107,240,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 80%);
}

/* ========== 4. Header ========== */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: rgba(11,14,20,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); z-index: 1000;
  display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
}
.header-left { display: flex; align-items: baseline; gap: 12px; }
.header-left .h-title { font-size: 18px; font-weight: 700; color: var(--text-0); letter-spacing: 0.5px; }
.header-left .h-sub { font-family: var(--font-en); font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1.5px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right .badge {
  font-size: 12px; padding: 4px 12px; border-radius: 999px;
  background: var(--accent-glow); color: var(--accent); border: 1px solid var(--border-strong);
  font-family: var(--font-en); letter-spacing: 0.5px;
}

/* ========== 5. Layout ========== */
.container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: calc(var(--header-h) + 60px) 32px 80px; }

/* ========== 6. Hero ========== */
.hero { text-align: center; margin-bottom: 80px; }
.hero-tag {
  display: inline-block; font-family: var(--font-en); font-size: 12px;
  color: var(--accent); letter-spacing: 2px; text-transform: uppercase;
  padding: 6px 16px; border-radius: 999px; border: 1px solid var(--border-strong);
  background: var(--accent-glow); margin-bottom: 24px;
}
.hero h1 {
  font-size: 48px; font-weight: 800; color: var(--text-0); line-height: 1.15;
  letter-spacing: -0.02em; margin-bottom: 16px;
}
.hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { font-size: 17px; color: var(--text-2); max-width: 640px; margin: 0 auto; line-height: 1.7; }
.hero-stats { display: flex; justify-content: center; gap: 48px; margin-top: 40px; }
.hero-stat { text-align: center; }
.hero-stat .num { font-family: var(--font-en); font-size: 36px; font-weight: 800; color: var(--text-0); }
.hero-stat .label { font-size: 13px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* ========== 7. Gallery Grid ========== */
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
@media (max-width: 1024px) { .gallery { grid-template-columns: 1fr; } }

/* ========== 8. Style Card ========== */
.style-card {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; transition: all 0.4s var(--ease);
}
.style-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }

/* Card Header */
.sc-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sc-head-left { display: flex; align-items: center; gap: 12px; }
.sc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.sc-title { font-size: 17px; font-weight: 700; color: var(--text-0); }
.sc-sub { font-family: var(--font-en); font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.sc-cat { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-en); letter-spacing: 0.5px; text-transform: uppercase; }

/* Card Body — Mini Preview */
.sc-preview { padding: 24px; position: relative; min-height: 200px; display: flex; flex-direction: column; gap: 12px; }

/* Color Swatches */
.sc-colors { display: flex; gap: 6px; margin-bottom: 4px; }
.sc-swatch { width: 28px; height: 28px; border-radius: 6px; position: relative; cursor: pointer; transition: transform 0.2s; }
.sc-swatch:hover { transform: scale(1.15); z-index: 1; }
.sc-swatch::after {
  content: attr(data-color); position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-en); font-size: 9px; color: var(--text-3); white-space: nowrap;
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.sc-swatch:hover::after { opacity: 1; }

/* Mini UI elements inside preview */
.mini-card { padding: 14px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; }
.mini-card .mini-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.mini-card .mini-text { flex: 1; }
.mini-card .mini-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.mini-card .mini-desc { font-size: 11px; opacity: 0.7; }
.mini-btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.mini-input { padding: 8px 12px; border-radius: 6px; font-size: 12px; flex: 1; outline: none; }

/* Card Footer — Meta */
.sc-meta { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; }
.sc-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 6px;
  background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border);
}
.sc-tag strong { color: var(--text-0); font-weight: 600; }

/* ========== 9. Footer ========== */
.footer { text-align: center; padding: 60px 0 20px; color: var(--text-3); font-size: 13px; }
.footer a { color: var(--accent); }

/* ========== 10. Fade In Animation ========== */
.fade-up { opacity: 0; transform: translateY(30px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.fade-up.visible { opacity: 1; transform: translateY(0); }
</style>

// Render gallery
function renderGallery() {
  var html = '';
  STYLES.forEach(function(s, i) {
    var catBg = 'rgba(124,107,240,0.08)';
    var catText = '#7C6BF0';
    if (s.cat === 'dark') { catBg = 'rgba(0,200,215,0.08)'; catText = '#00C8D7'; }
    else if (s.cat === 'modern') { catBg = 'rgba(0,102,255,0.08)'; catText = '#0066FF'; }
    else if (s.cat === 'creative') { catBg = 'rgba(255,107,107,0.08)'; catText = '#FF6B6B'; }
    else if (s.cat === 'business') { catBg = 'rgba(37,99,235,0.08)'; catText = '#2563EB'; }
    else if (s.cat === 'cultural') { catBg = 'rgba(139,44,44,0.08)'; catText = '#8B2C2C'; }

    html += '<div class="style-card fade-up" style="transition-delay:' + (i * 60) + 'ms;">';
    html += '<div class="sc-head">';
    html += '<div class="sc-head-left">';
    html += '<div class="sc-icon" style="background:' + catBg + ';color:' + s.iconColor + ';">' + s.icon + '</div>';
    html += '<div><div class="sc-title">' + s.name + '</div><div class="sc-sub">' + s.nameEn + '</div></div>';
    html += '</div>';
    html += '<span class="sc-cat" style="background:' + catBg + ';color:' + catText + ';">' + s.catLabel + '</span>';
    html += '</div>';

    // Colors
    html += '<div class="sc-preview">';
    html += '<div class="sc-colors">';
    s.colors.forEach(function(c) {
      html += '<div class="sc-swatch" style="background:' + c.c + ';border:1px solid rgba(255,255,255,0.1);" data-color="' + c.n + ' ' + c.c + '"></div>';
    });
    html += '</div>';

    // Mini preview
    html += getPreviewHTML(s.preview);

    html += '</div>';

    // Meta tags
    html += '<div class="sc-meta">';
    s.tags.forEach(function(t) {
      html += '<span class="sc-tag"><strong>' + t.k + '</strong> ' + t.v + '</span>';
    });
    html += '<span class="sc-tag" style="border-color:' + catText + '20;color:' + catText + ';"><strong>适用</strong> ' + s.useCase + '</span>';
    html += '</div>';

    html += '</div>';
  });
  document.getElementById('gallery').innerHTML = html;

  // Observe fade-up
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(function(el) {
    observer.observe(el);
  });
}

renderGallery();
</script>
